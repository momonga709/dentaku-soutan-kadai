<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101917"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>電卓</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><button id="history-toggle" aria-label="計算履歴を開く">履歴 ↗</button></header><section class="display" aria-label="計算結果"><div id="expression"></div><output id="result" aria-live="polite">0</output></section><section class="keys" aria-label="電卓キー"><button data-key="clear" class="utility">AC</button><button data-key="sign" class="utility" aria-label="正負を切り替え">+/−</button><button data-key="percent" class="utility">%</button><button data-key="/" class="operator" aria-label="割る">÷</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="*" class="operator" aria-label="掛ける">×</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="-" class="operator" aria-label="引く">−</button><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="+" class="operator" aria-label="足す">+</button><button data-key="backspace" aria-label="一桁削除">⌫</button><button data-key="0">0</button><button data-key=".">.</button><button data-key="=" class="equals" aria-label="計算する">=</button></section><footer>ひと息ついて、次の計算へ。</footer></main><dialog id="history"><div class="dialog-title"><h2>計算履歴</h2><button id="close-history" aria-label="履歴を閉じる">✕</button></div><p>結果をタップすると、続けて計算できます。</p><div id="history-list"></div><button id="clear-history">履歴を消去</button></dialog><script src="engine.js"></script><script src="app.js"></script></body></html>
